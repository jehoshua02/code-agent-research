name: Survey schema

on:
  pull_request:
    paths:
      - "docs/open/**"
      - "scripts/**"
      - ".github/workflows/survey-schema.yml"
  push:
    branches: [main]
    paths:
      - "docs/open/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate frontmatter schema
        run: python3 scripts/validate.py
      - name: Check INDEX and survey.json are in sync with frontmatter
        run: python3 scripts/regen.py --check
